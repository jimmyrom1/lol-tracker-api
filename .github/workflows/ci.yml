name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + tipos + tests (PostgreSQL real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lol
          POSTGRES_PASSWORD: lol
          POSTGRES_DB: lol_api_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lol"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lol:lol@localhost:5432/lol_api_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: test
    env:
      # Key falsa a propósito: sirve para comprobar que el servidor llega a Riot y que un
      # rechazo de la key se traduce en 502 sin filtrar detalles.
      RIOT_API_KEY: RGAPI-00000000-0000-0000-0000-000000000000
      APP_TOKEN: token-ci
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS localhost:3000/health
          curl -fsS localhost:3000/docs/json | grep -q '"LoL Tracker API"'
          # Sin token de la app → 401
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/riot/europe/lol/match/v5/matches/EUW1_1)" = 401
          # Ruta fuera de la lista blanca → 404, sin llegar a Riot
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-App-Token: token-ci' localhost:3000/riot/europe/lol/status/v4/platform-data)" = 404
          # Riot rechaza la key falsa → 502 sin detalles
          curl -s -H 'X-App-Token: token-ci' localhost:3000/riot/europe/lol/match/v5/matches/EUW1_1 | grep -q riot_key_rejected
          # Las migraciones han creado la tabla de caché
          docker compose exec -T db psql -U lol -d lol_api -c '\d riot_cache' | grep -q expires_at
      - name: Logs si falla
        if: failure()
        run: docker compose logs
